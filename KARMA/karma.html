<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma - Internet for Everyone</title>
  <link rel="stylesheet" href="/KARMA/css/karma.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">
        <img src="img/karma-logo.svg" alt="Karma Logo">
      </a>
      <button class="menu-toggle" aria-label="Abrir menú">
        <img src="img/menu-hamburger.svg" alt="Menú">
      </button>
      <nav class="nav-links">
        <ul>
          <li><a href="#" class="active">Meet Karma</a></li>
          <li><a href="#">How it Works</a></li>
          <li><a href="#">Store</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Help</a></li>
          <li><a href="#">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <h1>Introducing Karma</h1>
      <p class="hero-subtitle">Bring WiFi with you, everywhere you go.</p>
      <a href="#" class="btn btn-primary">Learn More</a>
    </div>
  </section>

  <section class="features">
    <div class="container">
      <h2>Everyone needs a little Karma.</h2>
      <div class="features-grid">
        
        <div class="feature-card">
          <div class="icon-wrapper">
            <img src="img/icon-devices.svg" alt="Internet para todos los dispositivos">
          </div>
          <h3>Internet for all devices</h3>
        </div>

        <div class="feature-card">
          <div class="icon-wrapper">
            <img src="img/icon-coffee.svg" alt="Aumenta tu productividad">
          </div>
          <h3>Boost your productivity</h3>
        </div>

        <div class="feature-card">
          <div class="icon-wrapper">
            <img src="img/icon-refill.svg" alt="Paga solo por lo que usas">
          </div>
          <h3>Pay as You Go</h3>
        </div>

      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-container">
      <p class="footer-title">Join us on</p>
      <div class="social-links">
        <a href="#" aria-label="Twitter">
          <img src="img/twitter-icon.svg" alt="Twitter">
        </a>
        <a href="#" aria-label="Facebook">
          <img src="img/facebook-icon.svg" alt="Facebook">
        </a>
        <a href="#" aria-label="Instagram">
          <img src="img/instagram-icon.svg" alt="Instagram">
        </a>
      </div>
      <p class="copyright">&copy; Karma Mobility, Inc.</p>
    </div>
  </footer>

</body>
</html>
